name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, ric-pet-ui-pro-max ]
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android lint regression gate
        run: gradle :app:lintDebug --stacktrace
      - name: Preserve lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RIC-Pet-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RIC-Pet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
